[project]
name = "store-sting-backend"
version = "0.1.0"
description = "STORE STING - Multi-Agent Intelligent E-Commerce Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "email-validator>=2.1.0",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
